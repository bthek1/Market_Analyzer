name: Frontend Tests & Build

on:
  # NOT on push to main: "Auto Version" (version.yml) already calls this via
  # workflow_call, and running both duplicated every job on the shared runners.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-test:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  frontend-build:
    runs-on: self-hosted
    timeout-minutes: 20
    needs: frontend-test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
