<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Empty state & alerts</title>
<link rel="stylesheet" href="card.css" />
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .empty {
    border: 1px dashed #e5e7eb; border-radius: 8px; padding: 22px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    background: #fff;
  }
  .empty svg { color: #9ca3af; }
  .empty p { margin: 0; font: 400 14px var(--sm-font-sans); color: #6b7280; }
  .empty a { color: #2563eb; text-decoration: underline; }
  .alert {
    background: #fef2f2; color: #b91c1c; border-radius: 4px;
    padding: 10px 14px; font: 400 14px var(--sm-font-sans);
  }
  .alert.ok { background: #f0fdf4; color: #15803d; }
  .alert.warn { background: #fffbeb; color: #92400e; }
  .lbl { font-family: var(--sm-font-mono); font-size: 11px; color: var(--sm-fg-subtle); margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div>
      <div class="lbl">Empty state</div>
      <div class="empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></svg>
        <p>Your watchlist is empty. <a>Browse stocks</a></p>
      </div>
    </div>
    <div>
      <div class="lbl">Alerts</div>
      <div class="col" style="gap: 8px">
        <div class="alert">Invalid email or password.</div>
        <div class="alert warn">Some price data is more than 24h old.</div>
        <div class="alert ok">Added AAPL to your watchlist.</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
