<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadows & elevation</title>
<link rel="stylesheet" href="card.css" />
<style>
  body { background: #f9fafb; }
  .card { background: #f9fafb; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px 0; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box  { width: 110px; height: 80px; background: #fff; border-radius: 8px; }
  .name { font-family: var(--sm-font-mono); font-size: 12px; color: var(--sm-fg); font-weight: 600; }
  .meta { font-family: var(--sm-font-mono); font-size: 11px; color: var(--sm-fg-subtle); }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="tile"><div class="box" style="border:1px solid #e5e7eb"></div><span class="name">none</span><span class="meta">border only</span></div>
    <div class="tile"><div class="box" style="box-shadow: var(--sm-shadow-sm)"></div><span class="name">shadow-sm</span><span class="meta">subtle lift</span></div>
    <div class="tile"><div class="box" style="box-shadow: var(--sm-shadow)"></div><span class="name">shadow</span><span class="meta">auth card</span></div>
    <div class="tile"><div class="box" style="box-shadow: var(--sm-shadow-md)"></div><span class="name">shadow-md</span><span class="meta">menus, popovers</span></div>
  </div>
</div>
</body>
</html>
