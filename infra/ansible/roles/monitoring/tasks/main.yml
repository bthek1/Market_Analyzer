---
# Observability server. Runs the four services as Docker containers rather than as an
# Ansible-managed set of packages: upstream ships images, the LXC already has nesting
# enabled, and it keeps the monitoring stack outside the app's blast radius.

- name: Set DNS resolvers
  copy:
    dest: /etc/resolv.conf
    content: "nameserver 8.8.8.8\nnameserver 1.1.1.1\n"

- name: Install core packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    update_cache: true
    state: present

- name: Ensure apt keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Docker's own repo, not Ubuntu's docker.io: the latter ships no compose v2 plugin, and
# `docker compose` (not docker-compose) is what the systemd unit below calls.
- name: Add Docker apt signing key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Create stack directory
  file:
    path: "{{ obs_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Straight from the repo, so the config under review is the config running. Any change
# here restarts the stack via the handler.
- name: Copy stack configuration from repo
  copy:
    src: "{{ playbook_dir }}/../observability/"
    dest: "{{ obs_stack_dir }}/"
    owner: root
    group: root
    # World-readable on purpose: these files are bind-mounted into containers that run
    # as non-root (prometheus as nobody, loki as uid 10001, grafana as uid 472). At 0640
    # root-owned, every one of them fails to read its own config at startup.
    mode: "0644"
    directory_mode: "0755"
  notify: restart observability stack

# Required, not optional: compose fails without it, and Grafana would otherwise fall
# back to admin/admin. Add vault_grafana_admin_password to vault/prod.yml before the
# first run (ansible-vault edit infra/ansible/vault/prod.yml).
- name: Write Grafana admin credentials
  template:
    src: stack.env.j2
    dest: "{{ obs_stack_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: restart observability stack

- name: Deploy observability stack systemd unit
  template:
    src: observability-stack.service.j2
    dest: /etc/systemd/system/observability-stack.service
  notify: restart observability stack

- name: Enable and start the observability stack
  systemd:
    name: observability-stack
    enabled: true
    state: started
    daemon_reload: true
