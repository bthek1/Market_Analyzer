# Grafana + Prometheus + Loki + Tempo, the server half of the observability stack
# (issues #2 and #5).
# Runs on stockmarket-obs (192.168.2.208); the collection half is Grafana Alloy,
# installed on every host by infra/ansible/roles/observability.
#
# Managed on the host by observability-stack.service (roles/monitoring), so
# `systemctl restart observability-stack` is the supported way to bounce it.
#
# NOTE: Prometheus' remote-write receiver, Loki's push endpoint and Tempo's OTLP
# receivers are unauthenticated and published to the LAN, because Alloy on .200/.201
# has to reach them. That is acceptable only on a trusted private network - do not route this box
# anywhere public. Grafana itself is the one authenticated surface.
name: observability

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d of TSDB for three low-traffic hosts is a few GB; the size cap is the
      # backstop that keeps a metrics explosion from filling the 100 GB disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=30GB
      # Alloy pushes rather than Prometheus scraping, so this receiver is load-bearing.
      - --web.enable-remote-write-receiver
      # Exemplars are OFF by default and silently DROPPED when disabled - the write
      # succeeds, the sample lands, and only the trace id disappears. Tempo's span
      # metrics send them (see tempo/config.yml), and they are what turns a latency
      # spike in Grafana into one click to the trace that caused it.
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.10.8
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      # 3200 is the query API. Grafana reaches it over the compose network, so this
      # publish is only for debugging from the LAN.
      - "3200:3200"
      # OTLP receivers. These are the load-bearing ones: Alloy on .200/.201 pushes
      # traces here, the same direction as loki.write and prometheus.remote_write.
      - "4317:4317"
      - "4318:4318"
    # NO healthcheck, deliberately. The Tempo image is DISTROLESS - it has no shell and
    # no wget/curl - so a Loki-style ["CMD", "wget", ...] probe cannot execute and the
    # container would sit permanently "unhealthy" while serving fine. Verified against
    # grafana/tempo:2.10.8. Nothing here depends_on tempo being healthy, so the absence
    # costs nothing; liveness is checked by hitting /ready from outside instead.

  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    restart: unless-stopped
    # GF_SECURITY_ADMIN_PASSWORD lives here. Required, not optional: without it
    # Grafana silently falls back to admin/admin. roles/monitoring templates the file
    # from the Ansible vault; for a local checkout, cp .env.example .env.
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
      # Alert delivery. Points at the LAN mail catcher (Mailpit/MailHog style) on
      # 192.168.2.207:1025 - plain SMTP, no auth, no TLS, which is why there is no
      # credential here and nothing to put in the vault. The catcher accepts mail for
      # ANY recipient, so the contact point's address is a label, not a real mailbox.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-192.168.2.207:1025}"
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-grafana@stockmarket.lab}"
      GF_SMTP_FROM_NAME: "Stock Market Alerts"
    volumes:
      # Datasources and dashboard providers are provisioned from the repo, so a
      # rebuilt container comes back with everything already wired.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
