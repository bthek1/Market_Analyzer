# NOTE: provisioning a policy tree REPLACES Grafana's default one, so every alert that
# is not matched by a child route lands on the root receiver below.
apiVersion: 1

policies:
  - orgId: 1
    receiver: email
    group_by:
      - grafana_folder
      - alertname
    # Deliberately slow: infrastructure alerts here are "go look at it", not pages. A
    # 5 min group interval batches a flapping host into one mail instead of twenty.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
