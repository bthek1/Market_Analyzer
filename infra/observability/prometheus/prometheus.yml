# Metrics arrive by remote_write from the Grafana Alloy agent on each host, not by
# Prometheus scraping outward (see docker-compose.yml for the receiver flag). Alloy owns
# discovery locally and pushes, which keeps LAN traffic one-directional - no inbound
# firewall holes on .200/.201 - and means there is no target list here to drift out of
# sync when a new exporter is added. The only scrape_config is Prometheus itself.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: stockmarket

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
